# Heap caps are deliberately low: this project is developed on a 6 GB desktop
# where the compositor must keep running. A 3 GB Gradle heap plus a separate
# 3 GB Kotlin daemon is enough to get the process OOM-killed.
org.gradle.jvmargs=-Xmx1200m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=false
org.gradle.workers.max=2

# Run the Kotlin compiler inside the Gradle daemon instead of forking a second
# JVM. Saves ~1 GB of resident memory at the cost of some build speed.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
